name: Tests

# Runs on every push and pull request, so a code change that breaks the
# collector, the build or the page shows up as a red check. (The daily data
# job runs the data checks itself before it commits; see daily-ejari.yml.)
on:
  push:
    branches-ignore: [data]   # the data branch holds no code
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Load the published data (data branch) for the data checks
        run: scripts/data-branch.sh load
      - name: Python tests (collector, build, published data)
        run: python3 -m unittest discover -s tests -v
      - name: Page tests (stale-data rule, script integrity)
        run: node --test tests/page.test.mjs tests/insights.test.mjs tests/labels.test.mjs tests/i18n.test.mjs
      - name: Browser check (Chromium + axe-core, real data)
        # Labels, overlaps, International City named when zoomed in, the rent check, the phone
        # layout, keyboard labels, and WCAG 2.1 AA (light and dark). See tests/ui-check.mjs.
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0 axe-core@4.14.1
          npx playwright install --with-deps chromium
          python3 scripts/stays_page.py data   # the map's stays file, as the deploy writes it
          node tests/ui-check.mjs
