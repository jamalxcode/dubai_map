name: Place unplaced areas

# Weekly (and by hand). Two steps:
#   1. Refresh official Dubai Municipality community points (dm_communities.csv).
#      Keeps the current file if the sources can't be reached.
#   2. Look up whatever DLD areas are still unplaced on OpenStreetMap, accept only
#      results that pass the checks in geocode_missing.py, list the rest for review.
#   3. Refresh the Metro and Tram lines and stations (collector/transit.py, OpenStreetMap).
on:
  schedule:
    - cron: "41 3 * * 0"   # Sundays 06:41 Kuwait time
  workflow_dispatch:

permissions:
  actions: write    # to keep this workflow's schedule switched on (step below)
  contents: write   # pushes to the data branch

concurrency:
  group: ejari-pull   # never runs at the same time as the daily data job
  cancel-in-progress: false

jobs:
  place:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep this schedule switched on (GitHub turns off quiet scheduled workflows after 60 days)
        # Data commits go to the data branch, so main can be quiet for weeks. A disabled workflow can't be
        # started by cron-job.org either. Same call as Flattery's scan.
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/geocode.yml/enable" && echo "schedule kept on"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Load the current data (data branch)
        run: scripts/data-branch.sh load
      - name: Official community points (Dubai Municipality)
        continue-on-error: true
        run: python3 collector/dm_communities.py
      - name: OpenStreetMap for what is left
        continue-on-error: true
        run: python3 collector/geocode_missing.py
      - name: Metro and Tram lines and stations (OpenStreetMap)
        # One Overpass request; keeps the current file if it can't be reached or the result looks wrong.
        continue-on-error: true
        run: python3 collector/transit.py
      - name: Rebuild and check
        run: |
          python3 collector/build.py
          python3 -m unittest discover -s tests -p "test_data.py"
      - name: Save the data (data branch)
        id: save
        run: |
          scripts/data-branch.sh save "data: place unplaced areas $(TZ=Asia/Kuwait date '+%Y-%m-%d')"

  deploy:
    needs: place
    if: needs.place.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
