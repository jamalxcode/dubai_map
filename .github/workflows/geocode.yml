name: Geocode missing communities

# Manual only. Prints OpenStreetMap candidates for communities without a map
# point; results are reviewed by hand before going into community_locations.csv.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 collector/geocode_missing.py
