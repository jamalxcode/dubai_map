name: Check the hotel collectors

# When collector/hotels.py, hotel_stats.py or hotel_prices.py changes on any branch: run them (one Overpass request,
# one Dubai Pulse download, Xotelo's Dubai list and prices for 15 hotels) without saving anything, and summarise what came back in the log, so a change can be
# checked before it is merged. The weekly job and the daily pull save the real files from main.
on:
  push:
    branches-ignore: [data]
    paths: [collector/hotels.py, collector/hotel_stats.py, collector/hotel_prices.py, collector/holiday_homes.py, .github/workflows/hotels-check.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Hotels from OpenStreetMap (not saved)
        continue-on-error: true
        run: python3 collector/hotels.py --out hotels.json
      - name: Official hotel figures from Dubai Pulse (not saved)
        continue-on-error: true
        run: |
          curl -sS -L -o det.csv -w "HTTP %{http_code} %{content_type} %{size_download} bytes\n" \
            -A "dubai-rent-atlas/1.0 (+https://github.com/jamalxcode/dubai_map)" \
            "https://www.dubaipulse.gov.ae/dataset/5ce622ab-91f2-4207-a694-79ac7eb39165/resource/b4ea30a4-42ee-4d82-a7ea-98a5a1363ce4/download/hotel_establishment_performance.csv" || true
          echo "--- first lines:"; head -c 1200 det.csv || true; echo; echo "--- last lines:"; tail -n 3 det.csv || true
          python3 collector/hotel_stats.py --from-file det.csv --out hotel_stats.json || true
      - name: Hotel prices from Xotelo, 15 hotels (not saved)
        continue-on-error: true
        run: |
          mkdir -p data && echo '{}' > data/state.json
          [ -f hotels.json ] && python3 collector/hotel_prices.py --hotels hotels.json --out hotel_prices.json --budget 15 || true
          python3 collector/holiday_homes.py --out holiday_homes.json --hotel-prices hotel_prices.json --budget 10 || true
      - name: What came back (for the log)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, collections
          if os.path.exists("hotels.json"):
              h = json.load(open("hotels.json"))["hotels"]
              print(len(h), "places:", dict(collections.Counter(x[2] for x in h)), "with stars:", sum(1 for x in h if x[3]))
          else:
              print("no hotels.json (Overpass not reachable or too few places)")
          if os.path.exists("hotel_stats.json"):
              s = json.load(open("hotel_stats.json"))
              print(len(s["months"]), "months of DET figures, latest:", s["latest"])
          else:
              print("no hotel_stats.json (Dubai Pulse needs access from here)")
          if os.path.exists("hotel_prices.json"):
              p = json.load(open("hotel_prices.json"))
              print(p["matched"], "places matched on Xotelo;", len(p["hotels"]), "priced, e.g.", p["hotels"][:3])
          else:
              print("no hotel_prices.json (Xotelo not reachable)")
          if os.path.exists("holiday_homes.json"):
              h = json.load(open("holiday_homes.json"))
              print(h["listed"], "holiday homes listed;", len(h["homes"]), "priced, e.g.", [r[:7] for r in h["homes"][:3]])
          else:
              print("no holiday_homes.json (Xotelo not reachable)")
          PY
