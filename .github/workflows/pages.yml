name: Deploy Dubai Rent Atlas to GitHub Pages

# Code from main + data from the data branch. Runs when code changes (push to main),
# when a data job saved new data (called from daily-ejari.yml / geocode.yml), or by hand.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { ref: main }
      - name: Load the data (data branch)
        run: scripts/data-branch.sh load
      - name: Assemble site (page + small JSON only, not the raw contract archive)
        run: |
          mkdir -p _site/data _site/assets
          cp index.html _site/
          [ -f .nojekyll ] && cp .nojekyll _site/ || true
          # No "|| true" here: a site without its data must fail, not deploy an empty map.
          cp data/areas*.json data/latest.json data/meta.json _site/data/
          cp -r assets/fonts _site/assets/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
