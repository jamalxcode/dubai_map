name: Deploy Dubai Real Estate Atlas to GitHub Pages

# Code from main + data from the data branch. Runs when code changes (push to main),
# when a data job saved new data (called from daily-ejari.yml / geocode.yml), or by hand.
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      artifact:
        # A run that deploys twice (daily-ejari.yml: the rents, then the stay prices) needs a different artifact name
        # each time: two artifacts called "github-pages" in one run make the second deploy fail.
        type: string
        default: github-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { ref: main }
      - name: Load the data (data branch)
        run: scripts/data-branch.sh load
      - name: Assemble site (page + small JSON only, not the raw contract archive)
        env:
          GMAPS_EMBED_KEY: ${{ secrets.GOOGLE_MAPS_EMBED_KEY }}
        run: |
          mkdir -p _site/data _site/assets
          # Version the page's own scripts and styles so browsers never mix a new page with old cached files.
          sed "s/__BUILD__/${GITHUB_SHA::7}/g" index.html > _site/index.html
          [ -f .nojekyll ] && cp .nojekyll _site/ || true
          # No "|| true" here: a site without its data must fail, not deploy an empty map.
          cp data/areas*.json data/latest.json data/meta.json _site/data/
          cp data/outlines.json _site/data/ 2>/dev/null || true  # community outlines (optional: the map works without them)
          cp data/changes.json _site/data/ 2>/dev/null || true  # what changed since the previous publication (optional)
          cp data/transit.json _site/data/ 2>/dev/null || true  # Metro and Tram lines and stations (optional: the layer hides without them)
          cp data/routes.json _site/data/ 2>/dev/null || true  # bus and marine routes from RTA's GTFS feed (optional: Bus and Boats hide without them)
          cp data/hotels.json data/hotel_stats.json data/hotel_prices.json data/holiday_homes.json data/stay_history.json data/serp_stays.json data/fx.json data/lifestyle.json _site/data/ 2>/dev/null || true  # Hotels view (optional: the button hides without hotels.json)
          # The status page (status/) reads the data branch live; these copies are its fallback.
          for f in status.json state.json runs.jsonl; do cp "data/$f" _site/data/ 2>/dev/null || true; done
          # The map's one small file for places-to-stay prices (the full files stay for the status page).
          python3 scripts/stays_page.py _site/data
          mkdir -p _site/status && sed "s/__BUILD__/${GITHUB_SHA::7}/g" status/index.html > _site/status/index.html
          cp -r assets/fonts assets/app assets/vendor _site/assets/
          # Google Maps Embed key (restricted by Google to this site): Street View photos in cards and in Street. No secret: they stay off.
          if [ -n "$GMAPS_EMBED_KEY" ]; then sed -i "s|__GMAPS_EMBED_KEY__|${GMAPS_EMBED_KEY}|" _site/assets/app/keys.js; echo "Street View photos on"; else echo "No GOOGLE_MAPS_EMBED_KEY: Street View photos off"; fi
          cp assets/share.png _site/assets/
          # One small page per area (a/<slug>/) so a shared link shows that area's figure in its preview.
          python3 scripts/share_pages.py _site
          python3 scripts/site_pages.py _site   # stats, all areas, yields, landing pages, feed.xml; adds them to the sitemap
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ inputs.artifact || 'github-pages' }}
      - name: Deploy
        id: deployment
        continue-on-error: true  # GitHub's artifact list sometimes lags the upload ("No artifacts named github-pages"); try again below
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ inputs.artifact || 'github-pages' }}
      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Deploy (second try)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ inputs.artifact || 'github-pages' }}
