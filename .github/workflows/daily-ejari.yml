name: Daily Ejari pull

# Once a day at 05:17 Kuwait time (02:17 UTC). The collector itself also refuses
# to contact the API more than once per Dubai calendar day, so manual re-runs
# are safe. Pushing a CSV into data/inbox/ imports it without touching the API.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Pull again even if already pulled today (use sparingly)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["data/inbox/**"]

permissions:
  contents: write

concurrency:
  group: ejari-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Pull Ejari contracts (once per day) and import inbox
        env:
          DUBAI_PULSE_KEY: ${{ secrets.DUBAI_PULSE_KEY }}
          DUBAI_PULSE_SECRET: ${{ secrets.DUBAI_PULSE_SECRET }}
          EJARI_API_URL: ${{ vars.EJARI_API_URL }}
          EJARI_FILTER: ${{ vars.EJARI_FILTER }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 collector/fetch_ejari.py
      - name: Build map data
        run: python3 collector/build.py
      - name: Commit data
        run: |
          git config user.name "dubai_map bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: Ejari update $(TZ=Asia/Kuwait date '+%Y-%m-%d %H:%M') Kuwait"
          git push
