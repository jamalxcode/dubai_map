name: Daily Ejari pull

# Once a day at 05:17 Kuwait time (02:17 UTC). Sources, in order:
#   1. DLD open-data service (OFF until DLD gives written permission;
#      then set repo variable DLD_ENABLED=1)  collector/fetch_dld.py
#   2. Dubai Pulse API (Dubai open-data licence, free key)  collector/fetch_ejari.py
#   3. Dubai Data community medians (CC BY 4.0)             collector/fetch_datadubai.py
#   4. Manual CSV in data/inbox/ (always imported)
# Each collector refuses to contact its source more than once per Dubai
# calendar day, so manual re-runs are safe. The data lives on the `data` branch
# (scripts/data-branch.sh); the site is redeployed only when the data changed.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Pull again even if already pulled today (use sparingly)"
        type: boolean
        default: false
      allow_shrink:
        description: "Publish even if contracts or areas dropped by more than 30% (only if the drop is real)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["data/inbox/**"]

permissions:
  contents: write

concurrency:
  group: ejari-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Load the current data (data branch)
        run: scripts/data-branch.sh load
      - name: "DLD open-data service (only if DLD_ENABLED=1, once per day)"
        continue-on-error: true  # a failing source must not stop the backups or the build
        env:
          DLD_ENABLED: ${{ vars.DLD_ENABLED }}
          DLD_DISABLED: ${{ vars.DLD_DISABLED }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 collector/fetch_dld.py
      - name: "Dubai Pulse API (if keys are set and the DLD service didn't run today) + inbox import"
        continue-on-error: true  # a failing source must not stop the backups or the build
        env:
          DUBAI_PULSE_KEY: ${{ secrets.DUBAI_PULSE_KEY }}
          DUBAI_PULSE_SECRET: ${{ secrets.DUBAI_PULSE_SECRET }}
          EJARI_API_URL: ${{ vars.EJARI_API_URL }}
          EJARI_FILTER: ${{ vars.EJARI_FILTER }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 collector/fetch_ejari.py
      - name: "Backup: Dubai Data community medians (Hugging Face, then GitHub)"
        continue-on-error: true  # a failing source must not stop the backups or the build
        run: python3 collector/fetch_datadubai.py
      - name: Build map data (refuses to publish a much smaller catalog than the last one)
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '0' }}
        run: python3 collector/build.py
      - name: Check the data before publishing (stops the commit if it looks broken)
        run: python3 -m unittest discover -s tests -p "test_data.py" -v
      - name: Save the data (data branch; nothing is saved if nothing changed)
        id: save
        run: |
          set -o pipefail
          scripts/data-branch.sh save "data: Ejari update $(TZ=Asia/Kuwait date '+%Y-%m-%d %H:%M') Kuwait" | tee -a "$GITHUB_OUTPUT"
      - name: Remove imported inbox files from main
        run: |
          git add -A data/inbox
          if git diff --cached --quiet; then echo "inbox empty"; exit 0; fi
          git -c user.name="dubai_map bot" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "data: imported inbox file(s); contracts are on the data branch"
          for i in 1 2 3; do git push origin HEAD:main && exit 0; sleep $((i * 5)); git pull --rebase -q origin main; done
          exit 1

  deploy:
    needs: pull
    if: needs.pull.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
