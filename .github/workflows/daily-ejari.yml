name: Daily Ejari pull   # runs three times a day; the name is kept so existing links and triggers still work

# Three times a day (see the schedule below). Sources, in order:
#   1. DLD open-data service (OFF until DLD gives written permission;
#      then set repo variable DLD_ENABLED=1)  collector/fetch_dld.py
#   2. Dubai Pulse API (Dubai open-data licence, free key)  collector/fetch_ejari.py
#   3. Dubai Data community medians (CC BY 4.0)             collector/fetch_datadubai.py
#   4. Manual CSV in data/inbox/ (always imported)
#   +  Cross-check pages (dubairealestatedata.com, continentalclub.ae), compared, never shown
#      instead of ours                                     collector/fetch_crosscheck.py
# Each collector waits at least 6 hours between pulls of its source (the heavier
# daily extras run on the first pull of a Dubai day only), so re-runs are safe. The data lives on the `data` branch
# (scripts/data-branch.sh); the site is redeployed only when the data changed.
on:
  schedule:
    # 05:17, 13:17 and 21:17 Kuwait. cron-job.org starts it at these times through GitHub's API
    # (GitHub's own schedule runs hours late); this schedule is the backup. A duplicate start
    # minutes later does nothing: each source waits at least 6 hours between pulls.
    - cron: "17 2,10,18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Pull again even if a source was pulled less than 6 hours ago (use sparingly)"
        type: boolean
        default: false
      allow_shrink:
        description: "Publish even if contracts or areas dropped by more than 30% (only if the drop is real)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["data/inbox/**"]

permissions:
  actions: write    # to keep this workflow's schedule switched on (step below)
  contents: write

concurrency:
  group: ejari-pull
  cancel-in-progress: false

jobs:
  # GitHub's own timer often fires hours late, so its runs land just after one cron-job.org already
  # started. A timer run steps aside when a pull succeeded in the last 3 hours (manual and cron-job.org
  # starts always run); the timer stays as the backup if cron-job.org stops.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.recent.outputs.skip }}
    steps:
      - name: Skip a late timer run right after a successful pull
        id: recent
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            since=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-ejari.yml/runs?status=success&per_page=10" \
                  --jq "[.workflow_runs[] | select(.run_started_at >= \"$since\")] | length" || echo 0)
            if [ "${n:-0}" -gt 0 ]; then skip=true; echo "a pull succeeded since $since: this late timer run steps aside"; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  pull:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - name: Note the start time (for the run log)
        run: echo "RUN_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Keep this schedule switched on (GitHub turns off quiet scheduled workflows after 60 days)
        # Data commits go to the data branch, so main can be quiet for weeks. A disabled workflow can't be
        # started by cron-job.org either. Same call as Flattery's scan.
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-ejari.yml/enable" && echo "schedule kept on"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Load the current data (data branch)
        run: scripts/data-branch.sh load
      - name: "DLD open-data service (only if DLD_ENABLED=1, at most every 6 hours)"
        continue-on-error: true  # a failing source must not stop the backups or the build
        env:
          DLD_ENABLED: ${{ vars.DLD_ENABLED }}
          DLD_DISABLED: ${{ vars.DLD_DISABLED }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 collector/fetch_dld.py
      - name: "Dubai Pulse API (if keys are set, at most every 6 hours, unless the DLD service just ran) + inbox import"
        continue-on-error: true  # a failing source must not stop the backups or the build
        env:
          DUBAI_PULSE_KEY: ${{ secrets.DUBAI_PULSE_KEY }}
          DUBAI_PULSE_SECRET: ${{ secrets.DUBAI_PULSE_SECRET }}
          EJARI_API_URL: ${{ vars.EJARI_API_URL }}
          EJARI_FILTER: ${{ vars.EJARI_FILTER }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 collector/fetch_ejari.py
      - name: "Backup: Dubai Data community medians (Hugging Face, then GitHub)"
        continue-on-error: true  # a failing source must not stop the backups or the build
        run: python3 collector/fetch_datadubai.py
      - name: "Official hotel figures (DET via Dubai Pulse; monthly, read each run, saved only when changed)"
        continue-on-error: true  # needs Dubai Pulse access (the same key); without it the current file stays
        env:
          DUBAI_PULSE_KEY: ${{ secrets.DUBAI_PULSE_KEY }}
          DUBAI_PULSE_SECRET: ${{ secrets.DUBAI_PULSE_SECRET }}
        run: python3 collector/hotel_stats.py
      - name: "Hotel prices (Xotelo, free, no key; about 100 hotels a pull on two sample nights, so each is refreshed every couple of days)"
        continue-on-error: true  # a failure keeps the last prices (shown up to 10 days) and the state says why
        timeout-minutes: 15
        run: python3 collector/hotel_prices.py
      - name: "Holiday homes and serviced apartments (Xotelo, free, no key; about 50 a pull, priced like hotels)"
        continue-on-error: true  # a failure keeps the last prices (shown up to 10 days) and the state says why
        timeout-minutes: 10
        run: python3 collector/holiday_homes.py
      - name: "Cross-check: dubairealestatedata.com and continentalclub.ae rent pages (at most once a day)"
        continue-on-error: true  # a check, never a reason to stop the build
        run: python3 collector/fetch_crosscheck.py
      - name: Place new areas on the map (OpenStreetMap; only names not tried in the last week)
        continue-on-error: true  # an unplaced area is listed, never a reason to stop the build
        env: { GEOCODE_TOP: "10" }
        run: python3 collector/geocode_missing.py
      - name: Build map data (refuses to publish a much smaller catalog than the last one)
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '0' }}
        run: python3 collector/build.py
      - name: Check the data before publishing (stops the commit if it looks broken)
        run: python3 -m unittest discover -s tests -p "test_data.py" -v
      - name: Log this run (data/runs.jsonl, last 300) and when Dubai Data publishes
        run: python3 scripts/run_log.py
      - name: Save the data (data branch; nothing is saved if nothing changed)
        id: save
        run: |
          scripts/data-branch.sh save "data: Ejari update $(TZ=Asia/Kuwait date '+%Y-%m-%d %H:%M') Kuwait"
      - name: Remove imported inbox files from main
        run: |
          git add -A data/inbox
          if git diff --cached --quiet; then echo "inbox empty"; exit 0; fi
          git -c user.name="dubai_map bot" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "data: imported inbox file(s); contracts are on the data branch"
          for i in 1 2 3; do git push origin HEAD:main && exit 0; sleep $((i * 5)); git pull --rebase -q origin main; done
          exit 1

  deploy:
    needs: pull
    if: needs.pull.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
